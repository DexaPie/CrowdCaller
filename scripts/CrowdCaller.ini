; Crowd Caller settings
; Key names: https://learn.microsoft.com/dotnet/api/system.windows.forms.keys  (e.g. D8, NumPad8, F9, K)

[Controls]
Key=D8
AltKey=NumPad8

[Crowd]
; How many people to bring (1-120)
Count=55
; Look for people this far away (metres)
GatherRadius=300
; Where they stand around you (metres)
MinDistance=6
MaxDistance=22
; Create extra random people if there are not enough around (true/false)
SpawnExtra=true
; Keep them from despawning for this many seconds (0 = let the game decide)
HoldSeconds=90

[Misc]
ShowMessage=true
CooldownSeconds=2
